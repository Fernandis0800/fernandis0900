<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu ChatGPT Automatizado</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #343541; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 100%; max-width: 600px; height: 80vh; background: #444654; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; color: #ececf1; }
        .message { margin-bottom: 15px; padding: 10px 15px; border-radius: 5px; max-width: 85%; }
        .user { background-color: #202123; align-self: flex-end; margin-left: auto; }
        .bot { background-color: #10a37f; align-self: flex-start; }
        .input-area { display: flex; padding: 10px; background: #40414f; }
        input { flex: 1; padding: 12px; border: none; border-radius: 4px; background: #40414f; color: white; font-size: 16px; outline: none; }
        button { background: #10a37f; color: white; border: none; padding: 0 20px; margin-left: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1a7f64; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-box" id="chatBox">
        <div class="message bot">Olá! Eu sou o seu assistente automático. Faça uma pergunta!</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Digite sua pergunta aqui..." onkeypress="checkEnter(event)">
        <button onclick="sendMessage()">Enviar</button>
    </div>
</div>

<script>
    // Banco de dados de perguntas e respostas automáticas (Modifique como quiser!)
    const respostasAutomaticas = {
        "olá": "Olá! Como posso te ajudar com suas questões hoje?",
        "quem é você": "Eu sou um robô de respostas automáticas criado no GitHub!",
        "como funciona": "Você digita uma pergunta e eu procuro a resposta no meu banco de dados.",
        "qual o seu nome": "Pode me chamar de GitBot.",
        "ajuda": "Pergunte sobre 'quem é você', 'como funciona' ou crie suas próprias regras no código!"
    };

    function sendMessage() {
        const input = document.getElementById("userInput");
        const messageText = input.value.trim().toLowerCase();
        if (messageText === "") return;

        appendMessage(input.value, "user");
        input.value = "";

        // Simula o tempo de resposta da IA
        setTimeout(() => {
            let resposta = "Desculpe, ainda não sei responder a essa questão. Você pode me ensinar adicionando essa pergunta no código do arquivo index.html!";
            
            // Busca no banco de dados simples acima
            for (let chave in respostasAutomaticas) {
                if (messageText.includes(chave)) {
                    resposta = respostasAutomaticas[chave];
                    break;
                }
            }
            appendMessage(resposta, "bot");
        }, 600);
    }

    function appendMessage(text, sender) {
        const chatBox = document.getElementById("chatBox");
        const msgDiv = document.createElement("div");
        msgDiv.classList.add("message", sender);
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function checkEnter(event) {
        if (event.key === "Enter") sendMessage();
    }
</script>

</body>
</html>
